<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Letters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8F4FF; --ink:#1D2B4F; --soft:#5B6A8F; --panel:#FFFFFF; --empty:#D3E3F5;
  --r1:#FF5A5F; --r2:#FF9F1C; --r3:#F7C531; --r4:#2EC4B6; --r5:#5B7CFA;
  --btn:#1D2B4F; --btnInk:#FFFFFF;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12193A; --ink:#F2F5FF; --soft:#A9B4D6; --panel:#1C2550; --empty:#2A3566;
    --btn:#F7C531; --btnInk:#12193A; color-scheme: dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
  touch-action:manipulation; overflow-x:hidden;
}
main{
  max-width:640px; margin:0 auto; height:100%;
  display:flex; flex-direction:column; gap:14px; padding:14px 14px 18px;
}
.top{display:flex; justify-content:center; gap:10px; flex-wrap:wrap}
.home{flex-shrink:0; width:48px; height:48px; border-radius:50%; background:var(--panel); display:flex; align-items:center; justify-content:center; font-size:26px; text-decoration:none}
.mode{display:flex; gap:6px; background:var(--panel); border-radius:999px; padding:5px; align-self:center}
.mode button{
  font-family:inherit; font-size:20px; font-weight:700; border:none; background:transparent;
  color:var(--soft); padding:8px 22px; border-radius:999px; cursor:pointer;
}
.mode button[aria-pressed="true"]{background:var(--btn); color:var(--btnInk)}
/* Cyrillic falls back to a font whose tall glyph box would cover the language buttons. */
.display{text-align:center; line-height:.9; pointer-events:none}
#letter{
  font-size:clamp(48px,min(32vw,22dvh),190px); font-weight:800; display:inline-block;
  color:var(--ink); transition:color .2s;
}
#letter.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
#word{font-size:26px; font-weight:700; color:var(--soft); min-height:36px; margin-top:4px}
.boardWrap{flex:1; min-height:0; container-type:size; display:flex; align-items:center; justify-content:center}
.board{
  width:min(100%,calc(100cqh * var(--ratio))); container-type:inline-size;
  background:var(--panel); border-radius:22px; padding:10px;
  display:flex; flex-direction:column; gap:6px; cursor:pointer;
}
.row{display:grid; grid-template-columns:repeat(7,1fr); gap:min(6px,1.5cqw); border-radius:12px; padding:2px}
.row.flash{animation:flash .9s ease-out}
@keyframes flash{0%,100%{background:transparent}30%{background:var(--rc)}}
.cell{
  aspect-ratio:1; border-radius:50%; background:var(--empty); color:var(--soft);
  display:flex; align-items:center; justify-content:center;
  font-size:7cqw; font-weight:800; line-height:1;
}
.cell span{opacity:.35}
.cell.on{background:var(--rc); color:#fff; animation:drop .3s ease-out}
.cell.on span{opacity:1}
@keyframes drop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
#go{
  font-family:inherit; font-size:clamp(32px,min(12vw,7dvh),60px); font-weight:800;
  background:var(--btn); color:var(--btnInk); border:none; border-radius:999px;
  padding:clamp(12px,4dvh,36px) 20px; cursor:pointer; box-shadow:0 8px 0 var(--r5);
}
#go:active{transform:translateY(4px); box-shadow:0 2px 0 var(--r5)}
button:focus-visible{outline:4px solid var(--r4); outline-offset:3px}
#win{
  position:fixed; inset:0; display:none; align-items:center; justify-content:center;
  flex-direction:column; gap:20px; background:color-mix(in srgb,var(--bg) 88%,transparent);
  text-align:center; padding:24px; z-index:5;
}
#win.show{display:flex}
#win h2{font-size:clamp(40px,11vw,72px); margin:0; line-height:1}
#win p{font-size:26px; margin:0}
#again{font-family:inherit; font-size:30px; font-weight:800; background:var(--btn); color:var(--btnInk); border:none; border-radius:999px; padding:16px 34px; cursor:pointer}
#confetti{position:fixed; inset:0; pointer-events:none; z-index:6}
@media (prefers-reduced-motion: reduce){
  #letter.pop,.cell.on,.row.flash{animation:none}
}
</style>
</head>
<body>
<main>
  <div class="top">
    <a class="home" href="index.html" aria-label="All games">🏠</a>
    <div class="mode" role="group" aria-label="Language">
      <button data-lang="en" aria-pressed="true">English</button>
      <button data-lang="ru" aria-pressed="false">Русский</button>
    </div>
  </div>
  <div class="display">
    <div id="letter" aria-live="polite"></div>
    <div id="word"></div>
  </div>
  <div class="boardWrap"><div class="board" id="board" aria-label="Alphabet board, tap for the next letter"></div></div>
  <button id="go" data-t="go">Next letter</button>
</main>

<div id="win" role="dialog" aria-modal="true" aria-labelledby="winTitle">
  <h2 id="winTitle" data-t="winTitle"></h2>
  <p data-t="winText"></p>
  <button id="again" data-t="again"></button>
</div>
<canvas id="confetti"></canvas>

<script>
const ROWCOLORS = ["--r1","--r2","--r3","--r4","--r5"];
const PER_ROW = 7;
// [letter, spoken name, word]. Ъ, Ы and Ь start no words, so they have none.
const ALPHABETS = {
  en: [
    ["A","ay","Apple"],["B","bee","Ball"],["C","see","Cat"],["D","dee","Dog"],
    ["E","ee","Egg"],["F","ef","Fish"],["G","gee","Grapes"],["H","aitch","Hat"],
    ["I","eye","Ice cream"],["J","jay","Juice"],["K","kay","Kite"],["L","el","Lion"],
    ["M","em","Moon"],["N","en","Nest"],["O","oh","Orange"],["P","pee","Pig"],
    ["Q","cue","Queen"],["R","ar","Rainbow"],["S","ess","Sun"],["T","tee","Tree"],
    ["U","you","Umbrella"],["V","vee","Van"],["W","double you","Whale"],["X","ex","X-ray"],
    ["Y","why","Yo-yo"],["Z","zee","Zebra"]
  ],
  ru: [
    ["А","а","Арбуз"],["Б","бэ","Банан"],["В","вэ","Волк"],["Г","гэ","Гриб"],
    ["Д","дэ","Дом"],["Е","е","Ель"],["Ё","ё","Ёжик"],["Ж","жэ","Жук"],
    ["З","зэ","Зебра"],["И","и","Индюк"],["Й","и краткое","Йогурт"],["К","ка","Кот"],
    ["Л","эль","Лиса"],["М","эм","Мяч"],["Н","эн","Носорог"],["О","о","Облако"],
    ["П","пэ","Пингвин"],["Р","эр","Рыба"],["С","эс","Слон"],["Т","тэ","Тигр"],
    ["У","у","Утка"],["Ф","эф","Флаг"],["Х","ха","Хлеб"],["Ц","цэ","Цветок"],
    ["Ч","чэ","Черепаха"],["Ш","ша","Шарик"],["Щ","ща","Щенок"],["Ъ","твёрдый знак"],
    ["Ы","ы"],["Ь","мягкий знак"],["Э","э","Эскимо"],["Ю","ю","Юла"],["Я","я","Яблоко"]
  ]
};
const T = {
  en:{go:"Next letter",tapStart:"Tap to start the ABCs",
      winTitle:"A to Z!",winText:"You know the whole alphabet!",again:"Play again",done:"A to Z! You did it!"},
  ru:{go:"Дальше",tapStart:"Нажми, чтобы начать",
      winTitle:"От А до Я!",winText:"Ты знаешь весь алфавит!",again:"Ещё раз",done:"От А до Я! Молодец!"}
};
let lang = "en";
try { const s = localStorage.getItem("letters-lang"); if (s === "en" || s === "ru") lang = s; } catch(e){}

let count = 0;
let letters = [];
const board = document.getElementById("board");
const letterEl = document.getElementById("letter");
const wordEl = document.getElementById("word");
let cells = [], rows = [];

function buildBoard(){
  letters = ALPHABETS[lang];
  board.textContent = ""; cells = []; rows = [];
  board.style.setProperty("--ratio", PER_ROW / Math.ceil(letters.length / PER_ROW) * 0.82);
  for (let r = 0; r * PER_ROW < letters.length; r++){
    const row = document.createElement("div");
    row.className = "row";
    row.style.setProperty("--rc", `var(${ROWCOLORS[r % ROWCOLORS.length]})`);
    letters.slice(r*PER_ROW, (r+1)*PER_ROW).forEach(([ch])=>{
      const cell = document.createElement("div");
      cell.className = "cell";
      const span = document.createElement("span");
      span.textContent = ch;
      cell.appendChild(span);
      row.appendChild(cell); cells.push(cell);
    });
    board.appendChild(row); rows.push(row);
  }
}

function say(text){
  try{
    if(!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang === "ru" ? "ru-RU" : "en-US";
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith(lang));
    if (v) u.voice = v;
    u.rate = 0.85; u.pitch = 1.2;
    speechSynthesis.speak(u);
  }catch(e){}
}
function spoken(i){
  const [, name, word] = letters[i];
  return word ? `${name}. ${word}` : name;
}

function render(animateLast){
  cells.forEach((cell,i)=>{
    const on = i < count;
    if (on && !cell.classList.contains("on")) {
      cell.classList.add("on");
      cell.style.animation = animateLast && i === count-1 ? "" : "none";
    }
    if (!on) cell.classList.remove("on");
  });
  if (!count){
    letterEl.textContent = letters[0][0] + letters[0][0].toLowerCase();
    letterEl.style.color = "var(--ink)";
    wordEl.textContent = T[lang].tapStart;
    return;
  }
  const [ch, , word] = letters[count-1];
  letterEl.textContent = ch + ch.toLowerCase();
  letterEl.style.color = `var(${ROWCOLORS[Math.floor((count-1)/PER_ROW) % ROWCOLORS.length]})`;
  wordEl.textContent = word || "";
}

function bump(){ letterEl.classList.remove("pop"); void letterEl.offsetWidth; letterEl.classList.add("pop"); }

function add(){
  if (count >= letters.length) return;
  count++;
  render(true); bump();
  if (count % PER_ROW === 0 || count === letters.length){
    const row = rows[Math.ceil(count/PER_ROW) - 1];
    row.classList.remove("flash"); void row.offsetWidth; row.classList.add("flash");
  }
  if (count === letters.length){
    say(spoken(count-1) + ". " + T[lang].done);
    setTimeout(()=>{ document.getElementById("win").classList.add("show"); confetti(); }, 1200);
  } else {
    say(spoken(count-1));
  }
}
function back(){ if(count>0){ count--; render(false); bump(); if(count) say(spoken(count-1)); } }
function reset(){
  count = 0;
  document.getElementById("win").classList.remove("show");
  stopConfetti(); render(false);
}

board.addEventListener("click", add);
document.getElementById("go").addEventListener("click", add);
document.getElementById("again").addEventListener("click", reset);
// iOS Safari ignores user-scalable=no, so block pinch zoom directly.
document.addEventListener("gesturestart", e=>e.preventDefault());
document.addEventListener("keydown", e=>{
  if (e.target.tagName === "BUTTON") return;
  if (e.key===" "||e.key==="Enter"||e.key==="ArrowRight"){ e.preventDefault(); add(); }
  if (e.key==="Backspace"||e.key==="ArrowLeft"){ e.preventDefault(); back(); }
});

/* Language */
const langBtns = document.querySelectorAll("[data-lang]");
function applyLang(){
  document.documentElement.lang = lang;
  langBtns.forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang === lang));
  document.querySelectorAll("[data-t]").forEach(el=>{ el.textContent = T[lang][el.dataset.t]; });
  buildBoard();
  reset();
}
langBtns.forEach(b=>b.addEventListener("click", ()=>{
  if (b.dataset.lang === lang) return;
  lang = b.dataset.lang;
  try { localStorage.setItem("letters-lang", lang); } catch(e){}
  applyLang();
}));

/* Confetti */
const cv = document.getElementById("confetti"), ctx = cv.getContext("2d");
let parts = [], raf = null;
function confetti(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  cv.width = innerWidth; cv.height = innerHeight;
  const cs = getComputedStyle(document.documentElement);
  const colors = ROWCOLORS.map(v=>cs.getPropertyValue(v).trim());
  parts = Array.from({length:160},()=>({
    x:Math.random()*cv.width, y:-20-Math.random()*cv.height*0.5,
    vx:(Math.random()-.5)*3, vy:2+Math.random()*4, s:6+Math.random()*8,
    r:Math.random()*6, vr:(Math.random()-.5)*.3, c:colors[Math.floor(Math.random()*colors.length)]
  }));
  const tick = ()=>{
    ctx.clearRect(0,0,cv.width,cv.height);
    let alive = false;
    parts.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
      if (p.y < cv.height+20) alive = true;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
      ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore();
    });
    raf = alive ? requestAnimationFrame(tick) : null;
  };
  tick();
}
function stopConfetti(){ if(raf) cancelAnimationFrame(raf); raf=null; ctx.clearRect(0,0,cv.width,cv.height); }

applyLang();
</script>
</body>
</html>
