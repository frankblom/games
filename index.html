<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Games">
<title>Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF4E4; --ink:#2B2140; --soft:#6E6385; --panel:#FFFFFF; --shade:#EDE3D3;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#1A1530; --ink:#F6F2FF; --soft:#B3A9CC; --panel:#262043; --shade:#110D22; color-scheme: dark}
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0; min-height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
  touch-action:manipulation;
}
main{
  max-width:720px; margin:0 auto;
  padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));
}
h1{font-size:clamp(40px,11vw,64px); text-align:center; margin:0 0 20px; line-height:1}
.games{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:18px}
.games a{
  display:flex; flex-direction:column; align-items:center; gap:4px; padding:22px 14px 18px;
  background:var(--panel); color:inherit; text-decoration:none; border-radius:32px;
  border-bottom:8px solid var(--c);
}
.games a:active{transform:translateY(4px)}
.games a:focus-visible{outline:4px solid var(--c); outline-offset:3px}
.icon{font-size:72px; line-height:1.1}
.name{font-size:30px; font-weight:800; line-height:1.1; text-align:center}
.alt{font-size:20px; font-weight:600; color:var(--soft)}
</style>
</head>
<body>
<main>
  <h1>Let's play!</h1>
  <!-- To add a game: put its page next to this file and copy one of these links. -->
  <nav class="games">
    <a href="shapes.html" style="--c:#5B7CFA">
      <span class="icon">🟦</span>
      <span class="name">Shapes</span>
      <span class="alt">Фигуры</span>
    </a>
    <a href="numbers.html" style="--c:#FF9F1C">
      <span class="icon">🔢</span>
      <span class="name">Numbers</span>
      <span class="alt">Цифры</span>
    </a>
  </nav>
</main>
</body>
</html>
